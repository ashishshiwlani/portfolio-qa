name: Keep demo awake

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours; off the hour, when GitHub's scheduler is less delayed
  workflow_dispatch:          # run by hand from the Actions tab

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright
          playwright install --with-deps chromium
      - run: python .github/keep_awake.py
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: not-ready-screenshot
          path: not-ready.png
